type: object
allOf:
  - $ref: cloud-prompt-fields.schema.yaml
required:
  - prompt_id
  - shot_id
  - model
  - prompt
properties:
  prompt_id:
    type: string
  shot_id:
    type: string
  model:
    type: string
    enum:
      - ltx-2.5
      - minimax-h3
      - google/veo-3.1-lite
      - kwaivgi/kling-v3.0-pro
      - google/veo-3.1
      - alibaba/wan-3.0
  prompt:
    type: string
  duration:
    type: number
  fps:
    type: number
  camera_motion:
    type: string
  subject_motion:
    type: string
  environment_motion:
    type: string
  timing:
    type: string
  continuity:
    type: string
